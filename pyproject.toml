[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "distributed-video-qa-mcp"
version = "0.1.0"
description = "MCP server that downloads video (with audio merged), transcribes it, embeds frames and transcript in one multimodal space, and answers questions with timestamped evidence."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arthur Colle" }]
keywords = ["mcp", "mcp-server", "video", "yt-dlp", "whisper", "multimodal", "embeddings", "rag", "distributed-systems"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "mcp>=2.3,<3",
  "yt-dlp[default,deno]>=2026.10.26",
  "httpx>=0.27",
  "numpy>=1.26",
  "pillow>=10.3",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
mlx = ["mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]
faster-whisper = ["faster-whisper>=1.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
distributed-video-qa-mcp = "distributed_video_qa_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/arthurcolle/distributed-video-qa-mcp"
Issues = "https://github.com/arthurcolle/distributed-video-qa-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/distributed_video_qa_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: needs network and real provider credentials (deselected by default)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "S603", "S607", "S311", "S608", "ASYNC109", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
